<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Offline | Anshu Hegde Creative</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0B3B2C;
      color: #F6EFD9;
      font-family: 'Playfair Display', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .badge {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #F0CB5E;
      margin-bottom: 16px;
      padding: 6px 16px;
      border: 1px solid rgba(240, 203, 94, 0.3);
      border-radius: 9999px;
      display: inline-block;
    }
    h1 {
      font-size: 32px;
      color: #F0CB5E;
      margin-bottom: 16px;
    }
    p {
      font-family: 'Inter', sans-serif;
      color: rgba(246, 239, 217, 0.7);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 28px;
      font-size: 15px;
    }
    .btn {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #F7D56B 0%, #E5B83E 100%);
      color: #0B3B2C;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 9999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="badge">The First Ray Concept</div>
  <h1>You Are Currently Offline</h1>
  <p>It seems your internet connection was temporarily interrupted. Please reconnect to continue exploring our luxury portfolio, curated visual media, and mentorship masterclasses.</p>
  <button class="btn" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
